name: Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/sakura
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run smoke suite
        env:
          # Ensure no accidental machine-local secrets/paths leak into tests
          SAKURA_GAME_ROOT: ""
          SAKURA_UNITY_ROOT: ""
          XAI_API_KEY: ""
          ELEVENLABS_API_KEY: ""
        run: pytest -q

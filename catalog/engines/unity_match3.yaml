id: engine.unity_match3
label: Unity Match-3 Kit
status: draft
runtime: unity
unity:
  min_version: "2022.3"
# Conventional local checkout path (optional / gitignored). Not vendored here.
repo_path: projects/sakura-match
capabilities:
  - match3.grid
  - match3.swap
  - match3.cascade
  - match3.goals
  - ui.basic
exports:
  bindings_consumer: Resources
  config_consumer: ScriptableObjects
  notes: >
    Living Unity implementation is an external checkout (title.repo_path /
    SAKURA_UNITY_ROOT). Catalog bridge scripts and sample Resources bindings
    ship under integrations/unity-sakura-match/. Slots map to TileType + sprite paths.
tags:
  - match3
  - unity
  - mobile

id: title.sakura_match
label: Sakura Match
status: draft
brand_id: brand.sakura_soft
engine_id: engine.unity_match3
genre_tags:
  - match3
  - casual
  - anime
platforms:
  - ios
  - android
# Optional local Unity checkout (gitignored). Not vendored in this repo.
# Bridge scripts + sample Resources: integrations/unity-sakura-match/
# Override with --unity-root or SAKURA_UNITY_ROOT when importing.
repo_path: projects/sakura-match
exports:
  unity_project: projects/sakura-match
default_locale: en
content_files:
  cast: cast.yaml
  ggd: ggd.yaml
  slots: slots.yaml
  bindings: bindings.yaml
  levels: levels.yaml
gates:
  require_approved_bindings_for_release: true
  require_approved_player_facing_nodes: false
notes: >
  Unity match-3 sketch title. The live Unity tree is an external checkout
  at projects/sakura-match (or SAKURA_UNITY_ROOT). In-repo bridge code and
  a sample ResourcesCatalog live under integrations/unity-sakura-match/.
